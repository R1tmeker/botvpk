name: Responsive frontend
on:
  pull_request:
    paths: ["frontend/**", "miniapp/**", ".github/workflows/frontend-responsive.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: responsive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.responsive.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
